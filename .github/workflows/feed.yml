name: Update config feed

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (minute 17 avoids the busy top of the hour)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape last 50 configs from the channel
        run: python feed/scrape.py persianvpnhub 50 feed/configs.txt

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          if git diff --quiet -- feed/configs.txt; then
            echo "No change in configs."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > feed/updated.txt
          git add feed/configs.txt feed/updated.txt
          git commit -m "feed: update configs"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          for f in configs.txt updated.txt; do
            curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/feed/$f" || true
          done
